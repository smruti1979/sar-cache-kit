# MQTT broker at the ICP: retained messages act as a last-value cache.
listener 1883 127.0.0.1
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60
retain_available true
max_queued_messages 10000
max_inflight_messages 20
persistent_client_expiration 7d
# Devices should connect with clean_session=false (MQTT 3.1.1) or a session
# expiry interval (MQTT 5), publish positions with retain=true on asset/<id>/pos,
# and use QoS 1 for P0/P1 traffic.
