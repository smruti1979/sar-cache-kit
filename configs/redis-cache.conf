# Evictable CACHE instance (tool results, embeddings, retrieval, overlays).
# Never store authoritative incident state here: eviction can delete it.
port 6379
bind 127.0.0.1
protected-mode yes
maxmemory 12gb
maxmemory-policy allkeys-lfu
maxmemory-samples 10
lfu-log-factor 10
lfu-decay-time 1
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
activedefrag yes
save ""
appendonly no
tcp-keepalive 60
# Keep headroom below host RAM for client buffers and replication.
