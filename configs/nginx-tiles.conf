# Tile and overlay proxy cache for the Incident Command Post.
proxy_cache_path /var/cache/nginx/tiles    levels=1:2 keys_zone=tiles:100m    max_size=20g inactive=7d use_temp_path=off;
proxy_cache_path /var/cache/nginx/overlays levels=1:2 keys_zone=overlays:50m  max_size=2g  inactive=1h use_temp_path=off;

upstream tileserver { server 127.0.0.1:3000; keepalive 32; }

server {
    listen 8080;

    # Static base tiles: long TTL; bundle version is in the path.
    location /tiles/ {
        proxy_pass http://tileserver;
        proxy_cache tiles;
        proxy_cache_key "$scheme$host$uri";           # no query string or cookies in the key
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;                          # collapse concurrent misses
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;             # stale-while-revalidate
        add_header X-Cache-Status $upstream_cache_status always;
    }

    # Dynamic overlays: layer version in the path, e.g. /overlays/pmap/v17/12/2145/1423.pbf
    # A new version creates new keys, so nothing needs purging.
    location /overlays/ {
        proxy_pass http://tileserver;
        proxy_cache overlays;
        proxy_cache_key "$scheme$host$uri";
        proxy_cache_valid 200 5m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status always;
    }
}
