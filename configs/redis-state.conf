# Authoritative STATE instance (positions, assignments, coverage bitmaps, streams).
# noeviction: writes fail loudly instead of silently deleting state.
port 6380
bind 127.0.0.1
protected-mode yes
maxmemory 4gb
maxmemory-policy noeviction
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 900 1
save 300 100
save 60 10000
tcp-keepalive 60
# Alert on any rejected write (OOM) and on any evicted_keys > 0.
