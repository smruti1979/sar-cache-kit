# PostGIS tuning for a 64 GB data node (adjust to hardware).
shared_buffers = 16GB                 # about 25% of RAM; the OS page cache holds the rest
effective_cache_size = 48GB
work_mem = 64MB
maintenance_work_mem = 2GB
random_page_cost = 1.1                # NVMe
max_connections = 100                 # front with a connection pooler
shared_preload_libraries = 'pg_prewarm'
pg_prewarm.autoprewarm = true         # reload hot pages after a restart
pg_prewarm.autoprewarm_interval = 300s
# Materialized views for coverage and sector summaries:
#   REFRESH MATERIALIZED VIEW CONCURRENTLY coverage_by_sector;
